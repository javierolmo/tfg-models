[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-models"
version = "0.0.2"
description = "Machine Learning pipelines and models for real estate valuation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Javier Olmo", email = "olmo.injerto.javier@gmail.com" }
]
keywords = ["machine-learning", "real-estate", "lightgbm", "azure-datalake"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.6.0",
    "lightgbm>=4.7.0",
    "joblib>=1.4.0",
    "azure-storage-blob>=12.24.0",
    "azure-core>=1.32.0",
    "azure-identity>=1.15.0",
    "python-dotenv>=1.0.0",
    "setuptools>=70.0.0",
]

[project.optional-dependencies]
inference = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
]
train = [
    "pyarrow>=18.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
]
all = [
    "pyarrow>=18.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
]
dev = [
    "pyarrow>=18.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
tfg-models = "tfg_models.cli:main"
tfg-models-inference = "tfg_models.api.inference:start"
tfg-models-training = "tfg_models.api.training:start"

[tool.setuptools.packages.find]
where = ["src"]
