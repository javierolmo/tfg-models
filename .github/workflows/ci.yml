name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (OpenMP for LightGBM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
          pip install -e .[dev]

      - name: Run unit test suite with coverage
        run: |
          pytest tests/ --cov=tfg_models --cov-report=term-missing --cov-report=xml

      - name: Verify Inference Docker build
        run: |
          docker build -f Dockerfile.inference -t tfg-models-inference:ci-test .

      - name: Verify Training Docker build
        run: |
          docker build -f Dockerfile.train -t tfg-models-train:ci-test .
