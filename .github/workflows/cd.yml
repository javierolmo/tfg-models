name: CD

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  release-and-publish:
    name: Release Tag & Publish to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "Found version: $VERSION (tag: v$VERSION)"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push Git tag
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote, skipping tag creation."
          else
            echo "Creating and pushing git tag $TAG..."
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Hub repository
        id: docker_meta
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME || 'javierolmo' }}/tfg-models"
          echo "REPO=$REPO" >> $GITHUB_ENV
          echo "Target base repository: $REPO"

      - name: Build and push Inference Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.inference
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO }}-inference:${{ env.TAG }}
            ${{ env.REPO }}-inference:${{ env.VERSION }}
            ${{ env.REPO }}-inference:latest
            ${{ env.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Training Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.train
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO }}-train:${{ env.TAG }}
            ${{ env.REPO }}-train:${{ env.VERSION }}
            ${{ env.REPO }}-train:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
